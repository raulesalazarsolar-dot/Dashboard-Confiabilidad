name: Actualizar Dashboard Confiabilidad

on:
  schedule:
    - cron: '0 10 * * *' # Se ejecuta solo todos los días
  workflow_dispatch: # Activa el botón manual

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 📥 Descargar Excels desde Google Drive Público
      run: |
        mkdir -p data
        gdown --folder "https://drive.google.com/drive/folders/1xXeea_F6HTsI-Wfj7HTsI-Wfj7HP2KdCnzGtPIUQq?usp=sharing" -O data/

    - name: Ejecutar ETL y Generar Dashboard
      run: python main.py

    - name: Subir el nuevo index.html al repositorio
      run: |
        if [ -f "index.html" ]; then
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Dashboard de Confiabilidad"
          git push
        else
          echo "⚠️ El archivo index.html no se generó. Revisa los pasos anteriores."
          exit 1
        fi
